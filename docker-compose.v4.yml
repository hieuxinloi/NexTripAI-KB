services:
  neo4j-v4:
    image: neo4j:5
    container_name: nextrip-neo4j-v4
    restart: unless-stopped
    ports:
      - "7477:7474"
      - "7690:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_V4_PASSWORD:-change-me}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - nextrip_neo4j_v4_data:/data
      - nextrip_neo4j_v4_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nextrip_neo4j_v4_data:
    name: nextrip_neo4j_v4_data
  nextrip_neo4j_v4_logs:
    name: nextrip_neo4j_v4_logs
