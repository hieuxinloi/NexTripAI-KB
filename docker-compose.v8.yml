services:
  neo4j-v8:
    # V8 uses Cypher SEARCH for vector retrieval; SEARCH is available from Neo4j 2026.01.
    image: neo4j:2026.01
    container_name: nextrip-neo4j-v8
    restart: unless-stopped
    ports:
      - "7479:7474"
      - "7692:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_V8_PASSWORD:-change-me}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - nextrip_neo4j_v8_data:/data
      - nextrip_neo4j_v8_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  nextrip_neo4j_v8_data:
    name: nextrip_neo4j_v8_data
  nextrip_neo4j_v8_logs:
    name: nextrip_neo4j_v8_logs
