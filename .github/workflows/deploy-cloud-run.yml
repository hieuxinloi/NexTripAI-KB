name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [feature/data-traffic-pipeline]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy private KB
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY }}/nextripai-kb:${{ github.sha }}"
          gcloud builds submit --project "${{ vars.GCP_PROJECT_ID }}" --tag "$IMAGE" .
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --no-allow-unauthenticated
          gcloud run services add-iam-policy-binding "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --member "serviceAccount:${{ vars.BE_RUNTIME_SERVICE_ACCOUNT }}" \
            --role "roles/run.invoker"
