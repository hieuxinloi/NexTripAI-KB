[project]
name = "nextrip-graphrag"
version = "0.1.0"
description = "GraphRAG pipeline for Quy Nhon and Da Nang travel chatbot using Gemini and Neo4j."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "google-genai>=2.14.0,<3",
  "httpx>=0.27.0",
  "loguru>=0.7.2",
  "neo4j>=5.20.0,<7",
  "neo4j-graphrag>=1.18.0,<2",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
crawl = [
  "playwright>=1.46.0,<2",
]
menu-ocr = [
  "Pillow>=10.0.0,<13",
  "rapidocr>=3.0.0,<4",
  "onnxruntime>=1.20.0,<2",
]
orchestration = [
  "apache-airflow>=2.10.0,<4",
  "apache-airflow-providers-standard>=1.0.0,<2",
  "pendulum>=3.0.0,<4",
]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "pytest>=8.3.0",
  "ruff==0.16.0",
]

[project.scripts]
nextrip-graphrag = "nextrip_graphrag.__main__:main"
nextrip-pipeline = "nextrip_pipeline.cli:main"
nextrip-traffic = "nextrip_traffic.cli:main"
nextrip-current-mcp = "nextrip_current.mcp:main"

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [".git", ".venv", ".pytest*", "tmp"]

[tool.setuptools.packages.find]
include = [
  "nextrip_graphrag*",
  "nextrip_pipeline*",
  "nextrip_traffic*",
  "nextrip_current*",
]
