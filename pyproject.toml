[project]
name = "nextrip-graphrag"
version = "0.1.0"
description = "GraphRAG pipeline for Quy Nhon and Da Nang travel chatbot using Gemini and Neo4j."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.0",
  "loguru>=0.7.2",
  "neo4j>=5.20.0,<7",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx2>=2.5.0", "pytest>=8.0"]

[project.scripts]
nextrip-graphrag = "nextrip_graphrag.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["nextrip_graphrag*"]
